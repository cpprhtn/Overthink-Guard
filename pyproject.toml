[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overthink-guard"
dynamic = ["version"]
description = "See and stop overthinking in local reasoning models: a Shadow/Answer-now proxy for Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Junwon Lee", email = "cpprhtn@gmail.com" }]
dependencies = ["pyyaml>=6", "httpx>=0.27", "starlette>=0.37", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
overthink-guard = "overthink_guard.cli:main"
otg = "overthink_guard.cli:main"

[tool.hatch.version]
path = "src/overthink_guard/__init__.py"

# Allowlist, so untracked local files (notes, data) never end up in a published sdist.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/overthink_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# One-off spike scripts are kept as they were run.
extend-exclude = ["bench/spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF"]

# Read by editors running pylint; keeps their line limit in step with ruff.
[tool.pylint.format]
max-line-length = 120
