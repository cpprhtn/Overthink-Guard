[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overthink-guard"
version = "0.1.0"
description = "Overthink Guard"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Junwon Lee", email = "cpprhtn@gmail.com" }]
dependencies = ["pyyaml>=6", "httpx>=0.27", "starlette>=0.37", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
overthink-guard = "overthink_guard.cli:main"
otg = "overthink_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/overthink_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.pylint.format]
max-line-length = 120
