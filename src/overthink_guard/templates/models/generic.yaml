id: generic
match: []
thinking:
  start: "<think>"
  end: "</think>"
  starts_in_thinking: false
# Appended to the received thinking when prefilling the answer. Ollama strips the newline the
# model emits after <think>; restoring it keeps the prompt aligned with the KV cache (spike S1).
stop_injection:
  thinking_prefix: "\n"
  text: "\n\nI have enough to answer now."
# Tier 2 (opt-in): the probe prefills the answer up to an open \boxed{ and reads a few tokens.
probe:
  answer_prefix: "The final answer is $\\boxed{"
  max_tokens: 16
# Resuming thinking after a probe: the chat thinking field always closes the block, so the open tag
# goes in content instead and the model's continuation (thinking, end tag, answer) arrives as content.
resume:
  content_prefix: "<think>\n"
extract_boxed: true
# Longer captures are prose ("the answer is unique, but ..."), not answers.
max_answer_chars: 40
# "therefore x = 3" style patterns were dropped: on R1 traces they mostly catch intermediate
# assignments and double the at-stop/final disagreement (docs/spikes/tier0-r1-replay.md).
tentative_answer_patterns:
  - '(?i)\b(?:so|thus|therefore|hence),?\s+the\s+(?:final\s+)?answer\s+(?:is|should be|would be)\s*:?\s*(?P<ans>.+?)(?:\.(?:\s|$)|\n|$)'
  - '(?i)\bthe\s+(?:final\s+)?answer\s+is\s*:?\s*(?P<ans>.+?)(?:\.(?:\s|$)|\n|$)'
revision_patterns:
  - '(?i)\b(?:that|this|it)(?:''s| is| was) (?:wrong|incorrect|not (?:right|correct))\b'
  - '(?i)\bi made an? (?:mistake|error)\b'
  - '(?i)\b(?:that|this) (?:can''t|cannot) be right\b'
  - '(?i)(?:^|[.!?]\s+)no,\s'
