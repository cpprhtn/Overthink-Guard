id: generic
match: []
thinking:
  start: "<think>"
  end: "</think>"
  starts_in_thinking: false
stop_injection:
  text: "\n\nI have enough to answer now.\n</think>\n\n"
extract_boxed: true
tentative_answer_patterns:
  - '(?i)\b(?:so|thus|therefore|hence),?\s+the\s+(?:final\s+)?answer\s+(?:is|should be|would be)\s*:?\s*(?P<ans>.+?)(?:\.(?:\s|$)|\n|$)'
  - '(?i)\bthe\s+(?:final\s+)?answer\s+is\s*:?\s*(?P<ans>.+?)(?:\.(?:\s|$)|\n|$)'
  - '(?i)\b(?:so|thus|therefore|hence),?\s+(?P<ans>[a-z]\s*=\s*-?[\d.,/]+)'
revision_patterns:
  - '(?i)\b(?:that|this|it)(?:''s| is| was) (?:wrong|incorrect|not (?:right|correct))\b'
  - '(?i)\bi made an? (?:mistake|error)\b'
  - '(?i)\b(?:that|this) (?:can''t|cannot) be right\b'
  - '(?i)(?:^|[.!?]\s+)no,\s'
